<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sukoon Masjid</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#0b1320;
color:white;
padding:10px;
}

.card{
background:#162235;
border-radius:15px;
padding:15px;
margin-bottom:10px;
}

.mosque{
text-align:center;
}

.mosque h1{
font-size:28px;
}

.mosque p{
font-size:18px;
opacity:.8;
}

.clock{
text-align:center;
}

.time{
font-size:55px;
font-weight:bold;
}

.date{
font-size:18px;
margin-top:5px;
}

.next-prayer{
text-align:center;
background:#0f3d2e;
}

.next-prayer .title{
font-size:22px;
}

.next-prayer .name{
font-size:50px;
font-weight:bold;
margin:10px 0;
}

.next-prayer .countdown{
font-size:55px;
font-weight:bold;
color:#ffd54f;
}

.prayer{
display:flex;
justify-content:space-between;
align-items:center;
font-size:28px;
}

.prayer + .prayer{
margin-top:10px;
}

.ayah{
text-align:center;
font-size:24px;
line-height:1.8;
}

.hadith{
text-align:center;
font-size:22px;
line-height:1.8;
}

.active{
background:#1d6f42;
}

</style>
</head>
<body>

<!-- المسجد -->

<div class="card mosque">
<h1>🕌 مسجد مولاي بوعرفة</h1>
<p>الناظور - المغرب</p>
</div>

<!-- الساعة -->

<div class="card clock">
<div class="time">20:37</div>
<div class="date">الخميس 24 شتنبر 2026</div>
<div class="date">13 ربيع الآخر 1448 هـ</div>
</div>

<!-- الصلاة القادمة -->

<div class="card next-prayer">

<div class="title">
الصلاة القادمة
</div>

<div class="name">
العشاء
</div>

<div class="countdown">
00:47:09
</div>

</div>

<!-- الصلوات -->

<div class="card">

<div class="prayer">
<span>الفجر</span>
<span>04:31</span>
</div>

<div class="prayer">
<span>الظهر</span>
<span>12:09</span>
</div>

<div class="prayer">
<span>العصر</span>
<span>15:31</span>
</div>

<div class="prayer">
<span>المغرب</span>
<span>18:11</span>
</div>

<div class="prayer active">
<span>العشاء</span>
<span>19:25</span>
</div>

</div>

<!-- الآية -->

<div class="card ayah">

﴿ فَاذْكُرُونِي أَذْكُرْكُمْ
وَاشْكُرُوا لِي
وَلَا تَكْفُرُونِ ﴾

</div>

<!-- الحديث -->

<div class="card hadith">

قال رسول الله ﷺ :

« من دل على خير فله مثل أجر فاعله »

</div>

</body>
</html>
